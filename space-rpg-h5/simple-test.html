<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>简单API测试 - 星际探索者号</title>
    <link rel="stylesheet" href="css/terminal.css">
    <link rel="stylesheet" href="css/settings.css">
    <style>
        /* 独立页面布局适配 */
        body {
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .page-container {
            width: 100%;
            max-width: 600px;
            text-align: center;
        }

        .page-header {
            margin-bottom: 24px;
        }

        .page-header h1 {
            color: var(--accent-color, #00ccff);
            font-size: 1.3rem;
            font-family: 'Courier New', monospace;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(0, 204, 255, 0.4);
        }

        .page-header h1 i {
            margin-right: 8px;
            opacity: 0.7;
        }

        .test-result-panel {
            background: linear-gradient(180deg, rgba(0, 15, 25, 0.97) 0%, rgba(0, 10, 18, 0.99) 100%);
            border: 1px solid var(--terminal-border, #00aa00);
            border-radius: 12px;
            box-shadow:
                0 0 30px rgba(0, 170, 0, 0.15),
                0 0 60px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(0, 204, 255, 0.08);
            padding: 24px;
            font-family: 'Courier New', monospace;
            font-size: 0.95rem;
            line-height: 1.7;
            color: var(--terminal-text, #00ff00);
        }

        .test-result-panel.success {
            border-color: rgba(51, 204, 51, 0.5);
        }

        .test-result-panel.error {
            border-color: rgba(255, 51, 51, 0.5);
            color: var(--danger-color, #ff3333);
        }

        .test-result-panel.loading {
            color: var(--accent-color, #00ccff);
        }

        .test-result-panel i {
            margin-right: 8px;
            font-size: 1.1rem;
        }

        .back-link {
            display: inline-block;
            margin-top: 24px;
        }

        .back-link a {
            color: var(--accent-color, #00ccff);
            text-decoration: none;
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
            transition: all 0.25s ease;
        }

        .back-link a:hover {
            color: var(--terminal-text, #00ff00);
            text-shadow: 0 0 8px rgba(0, 255, 0, 0.4);
        }
    </style>
</head>
<body>
    <div class="page-container">
        <div class="page-header">
            <h1><i class="fas fa-flask"></i> 简单 API 测试</h1>
        </div>

        <div id="status" class="test-result-panel loading">
            <i class="fas fa-spinner fa-spin"></i> 正在加载...
        </div>

        <div class="back-link">
            <a href="index.html"><i class="fas fa-arrow-left"></i> 返回游戏</a>
        </div>
    </div>

    <script src="js/api-manager.js"></script>
    <script>
        console.log('简单测试开始');
        console.log('window.APIManager:', window.APIManager);
        console.log('typeof window.APIManager:', typeof window.APIManager);

        const statusEl = document.getElementById('status');

        if (window.APIManager && typeof window.APIManager === 'object') {
            console.log('APIManager方法列表:', Object.keys(window.APIManager));

            try {
                const providers = window.APIManager.getProviders();
                console.log('getProviders成功:', providers);
                statusEl.className = 'test-result-panel success';
                statusEl.innerHTML =
                    '<i class="fas fa-check-circle"></i> API 管理器加载成功！<br><br>' +
                    '<span style="color:#888;">提供商：</span>' +
                    providers.map(p => `<span style="color:var(--accent-color,#00ccff);">${p}</span>`).join(' / ');
            } catch (error) {
                console.error('getProviders失败:', error);
                statusEl.className = 'test-result-panel error';
                statusEl.innerHTML =
                    '<i class="fas fa-times-circle"></i> getProviders 失败<br><br>' +
                    '<span style="color:#888;">' + error.message + '</span>';
            }
        } else {
            console.error('APIManager未正确加载');
            statusEl.className = 'test-result-panel error';
            statusEl.innerHTML =
                '<i class="fas fa-times-circle"></i> APIManager 未正确加载<br><br>' +
                '<span style="color:#888;">请检查 js/api-manager.js 是否存在且无语法错误。</span>';
        }
    </script>
</body>
</html>
