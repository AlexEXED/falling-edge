<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API 设置 - 星际探索者号</title>
    <link rel="stylesheet" href="css/terminal.css">
    <link rel="stylesheet" href="css/settings.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* 独立页面布局适配 */
        body {
            padding: 30px 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .page-container {
            width: 100%;
            max-width: 860px;
        }

        /* 页面标题 */
        .page-header {
            text-align: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(0, 170, 0, 0.3);
        }

        .page-header h1 {
            color: var(--accent-color, #00ccff);
            font-size: 1.5rem;
            margin: 0 0 8px 0;
            font-family: 'Courier New', monospace;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(0, 204, 255, 0.4);
        }

        .page-header h1 i {
            margin-right: 10px;
            opacity: 0.7;
        }

        .page-header p {
            color: #88ff88;
            font-size: 0.85rem;
            margin: 0;
        }

        /* 使用 settings.css 的面板样式作为主体容器 */
        .page-panel {
            background: linear-gradient(180deg, rgba(0, 15, 25, 0.97) 0%, rgba(0, 10, 18, 0.99) 100%);
            border: 1px solid var(--terminal-border, #00aa00);
            border-radius: 12px;
            box-shadow:
                0 0 30px rgba(0, 170, 0, 0.15),
                0 0 60px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(0, 204, 255, 0.08);
            overflow: hidden;
        }

        /* 返回链接 */
        .link-back {
            text-align: center;
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid rgba(0, 170, 0, 0.2);
        }

        .link-back a {
            color: var(--accent-color, #00ccff);
            text-decoration: none;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            transition: all 0.25s ease;
        }

        .link-back a:hover {
            color: var(--terminal-text, #00ff00);
            text-shadow: 0 0 8px rgba(0, 255, 0, 0.4);
        }

        .link-back a i {
            margin-right: 6px;
        }

        /* 状态消息复用 settings.css 的 .api-status */
        .status-message {
            display: none;
        }

        .status-message.success {
            display: block;
        }

        .status-message.error {
            display: block;
        }

        .status-message.info {
            display: block;
        }
    </style>
</head>
<body>
    <div class="page-container">
        <!-- 页面标题 -->
        <div class="page-header">
            <h1><i class="fas fa-cog"></i> API 配置中心</h1>
            <p>配置 AI 服务以启用高级游戏功能</p>
        </div>

        <div class="page-panel">
            <!-- 状态消息 -->
            <div id="statusMessage" class="api-status" style="display:none; margin:20px 24px 0;"></div>

            <!-- 标签页内容区 -->
            <div class="settings-tab-content" style="max-height:none;">
                <!-- API 密钥设置 -->
                <div class="settings-tab-pane active">
                    <div class="settings-group">
                        <h3><i class="fas fa-key"></i> API 密钥设置</h3>

                        <div class="settings-item">
                            <label for="apiProvider">AI 服务提供商</label>
                            <select id="apiProvider" onchange="updateProviderInfo()">
                                <option value="deepseek">DeepSeek (推荐)</option>
                                <option value="openai">OpenAI (GPT)</option>
                                <option value="claude">Claude (Anthropic)</option>
                                <option value="qwen">Qwen (阿里云)</option>
                                <option value="glm">GLM (智谱)</option>
                                <option value="custom">自定义 API</option>
                            </select>
                        </div>

                        <div class="settings-item">
                            <label for="apiKey">API 密钥</label>
                            <input type="password" id="apiKey" placeholder="输入您的 API 密钥（仅在此会话保存）">
                        </div>
                        <div style="font-size:0.8rem;color:#666;margin:-8px 12px 14px;padding-left:0;">
                            <i class="fas fa-exclamation-triangle" style="color:var(--warning-color,#ff9900);margin-right:4px;"></i>
                            API 密钥仅保存在浏览器会话中，不会存储到本地或服务器。
                        </div>

                        <div class="settings-item">
                            <label for="apiModel">AI 模型</label>
                            <select id="apiModel">
                                <option>加载中...</option>
                            </select>
                        </div>

                        <div class="settings-item">
                            <label for="enableAPI">
                                <input type="checkbox" id="enableAPI"> 启用 AI 功能
                            </label>
                        </div>
                    </div>

                    <!-- 高级设置 -->
                    <div class="settings-group">
                        <h3><i class="fas fa-sliders-h"></i> 高级设置</h3>

                        <div class="settings-item">
                            <label for="temperature">温度 (Temperature): <span id="tempValue">0.7</span></label>
                            <input type="range" id="temperature" min="0" max="2" step="0.1" value="0.7"
                                   oninput="document.getElementById('tempValue').textContent = this.value">
                        </div>
                        <div style="font-size:0.8rem;color:#666;margin:-8px 12px 14px;">
                            控制响应创意程度（0=确定，2=随机）
                        </div>

                        <div class="settings-item">
                            <label for="maxTokens">最大令牌数</label>
                            <input type="number" id="maxTokens" value="500" min="100" max="4000" step="100">
                        </div>

                        <div class="settings-item">
                            <label for="customBaseURL">自定义 API 地址</label>
                            <input type="text" id="customBaseURL" placeholder="https://api.example.com/v1">
                        </div>
                        <div style="font-size:0.8rem;color:#666;margin:-8px 12px 14px;">
                            仅当选择"自定义 API"时需要填写
                        </div>
                    </div>

                    <!-- 当前配置 -->
                    <div class="settings-group">
                        <h3><i class="fas fa-info-circle"></i> 当前配置</h3>
                        <div style="background:rgba(0,0,0,0.3);border:1px solid rgba(0,170,0,0.2);border-radius:6px;padding:14px;">
                            <div class="settings-item" style="border-bottom:1px solid rgba(0,170,0,0.15);padding-bottom:10px;">
                                <label>提供商</label>
                                <span id="configProvider" style="color:var(--accent-color,#00ccff);font-family:'Courier New',monospace;font-size:0.9rem;">未配置</span>
                            </div>
                            <div class="settings-item" style="border-bottom:1px solid rgba(0,170,0,0.15);padding-bottom:10px;">
                                <label>模型</label>
                                <span id="configModel" style="color:var(--accent-color,#00ccff);font-family:'Courier New',monospace;font-size:0.9rem;">未配置</span>
                            </div>
                            <div class="settings-item" style="border-bottom:1px solid rgba(0,170,0,0.15);padding-bottom:10px;">
                                <label>状态</label>
                                <span id="configStatus" style="color:#888;font-family:'Courier New',monospace;font-size:0.9rem;">禁用</span>
                            </div>
                            <div class="settings-item">
                                <label>温度</label>
                                <span id="configTemp" style="color:var(--accent-color,#00ccff);font-family:'Courier New',monospace;font-size:0.9rem;">0.7</span>
                            </div>
                        </div>
                    </div>

                    <!-- 操作按钮 -->
                    <div class="settings-actions">
                        <button class="settings-btn primary" onclick="testConnection()">
                            <i class="fas fa-plug"></i> 测试连接
                        </button>
                        <button class="settings-btn primary" onclick="saveSettings()">
                            <i class="fas fa-save"></i> 保存设置
                        </button>
                        <button class="settings-btn" onclick="resetSettings()">
                            <i class="fas fa-redo"></i> 重置
                        </button>
                        <button class="settings-btn danger" onclick="clearApiKey()">
                            <i class="fas fa-trash"></i> 清除密钥
                        </button>
                    </div>
                </div>
            </div>

            <!-- 底部栏 -->
            <div class="settings-modal-footer">
                <a href="index.html" class="settings-btn" style="text-decoration:none;">
                    <i class="fas fa-arrow-left"></i> 返回游戏
                </a>
            </div>
        </div>
    </div>

    <!-- 脚本 -->
    <script src="js/api-manager.js"></script>
    <script>
        // 初始化页面
        window.addEventListener('DOMContentLoaded', function() {
            loadSettings();
            updateProviderInfo();
        });

        // 加载设置
        function loadSettings() {
            const apiManager = window.APIManager.instance;
            const config = apiManager.getConfig();

            document.getElementById('apiProvider').value = config.currentProvider;
            document.getElementById('apiModel').value = config.currentModel;
            document.getElementById('temperature').value = config.temperature;
            document.getElementById('tempValue').textContent = config.temperature;
            document.getElementById('maxTokens').value = config.maxTokens;
            document.getElementById('customBaseURL').value = config.customBaseURL || '';
            document.getElementById('enableAPI').checked = config.enabled;

            updateConfigDisplay();
        }

        // 更新提供商信息
        function updateProviderInfo() {
            const provider = document.getElementById('apiProvider').value;
            const apiManager = window.APIManager.instance;
            const models = apiManager.getAvailableModels(provider);

            const modelSelect = document.getElementById('apiModel');
            modelSelect.innerHTML = '';

            models.forEach(model => {
                const option = document.createElement('option');
                option.value = model;
                option.textContent = model;
                modelSelect.appendChild(option);
            });
        }

        // 保存设置
        function saveSettings() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const provider = document.getElementById('apiProvider').value;
            const model = document.getElementById('apiModel').value;
            const temperature = parseFloat(document.getElementById('temperature').value);
            const maxTokens = parseInt(document.getElementById('maxTokens').value);
            const customBaseURL = document.getElementById('customBaseURL').value.trim();
            const enabled = document.getElementById('enableAPI').checked;

            if (enabled && !apiKey) {
                showMessage('请输入 API 密钥', 'error');
                return;
            }

            try {
                const apiManager = window.APIManager.instance;

                apiManager.updateConfig({
                    apiKey: apiKey,
                    currentProvider: provider,
                    currentModel: model,
                    temperature: temperature,
                    maxTokens: maxTokens,
                    customBaseURL: customBaseURL,
                    enabled: enabled
                });

                if (apiKey) {
                    apiManager.saveApiKeyToSession();
                }

                updateConfigDisplay();
                showMessage('设置已保存', 'success');
            } catch (error) {
                showMessage('保存失败: ' + error.message, 'error');
            }
        }

        // 测试连接
        async function testConnection() {
            const apiKey = document.getElementById('apiKey').value.trim();

            if (!apiKey) {
                showMessage('请先输入 API 密钥', 'error');
                return;
            }

            try {
                showMessage('正在测试连接...', 'info');

                const apiManager = window.APIManager.instance;
                apiManager.apiKey = apiKey;

                const result = await apiManager.testConnection();

                if (result.success) {
                    showMessage(result.message, 'success');
                } else {
                    showMessage(result.message, 'error');
                }
            } catch (error) {
                showMessage('测试失败: ' + error.message, 'error');
            }
        }

        // 重置设置
        function resetSettings() {
            if (confirm('确定要重置所有设置吗？')) {
                document.getElementById('apiKey').value = '';
                document.getElementById('apiProvider').value = 'deepseek';
                document.getElementById('temperature').value = 0.7;
                document.getElementById('tempValue').textContent = '0.7';
                document.getElementById('maxTokens').value = 500;
                document.getElementById('customBaseURL').value = '';
                document.getElementById('enableAPI').checked = false;

                updateProviderInfo();
                showMessage('设置已重置', 'success');
            }
        }

        // 清除 API 密钥
        function clearApiKey() {
            if (confirm('确定要清除 API 密钥吗？')) {
                const apiManager = window.APIManager.instance;
                apiManager.clearApiKeyFromSession();
                document.getElementById('apiKey').value = '';
                document.getElementById('enableAPI').checked = false;
                updateConfigDisplay();
                showMessage('API 密钥已清除', 'success');
            }
        }

        // 更新配置显示
        function updateConfigDisplay() {
            const apiManager = window.APIManager.instance;
            const config = apiManager.getConfig();

            document.getElementById('configProvider').textContent = config.currentProvider;
            document.getElementById('configModel').textContent = config.currentModel;
            document.getElementById('configStatus').textContent = config.enabled ? '启用' : '禁用';
            document.getElementById('configStatus').style.color = config.enabled ? 'var(--success-color,#33cc33)' : '#888';
            document.getElementById('configTemp').textContent = config.temperature;
        }

        // 显示消息
        function showMessage(message, type) {
            const messageEl = document.getElementById('statusMessage');
            messageEl.style.display = 'block';
            messageEl.className = 'api-status ' + type;

            let icon = '';
            switch (type) {
                case 'success':
                    icon = '<i class="fas fa-check-circle"></i> ';
                    break;
                case 'error':
                    icon = '<i class="fas fa-times-circle"></i> ';
                    break;
                case 'info':
                    icon = '<i class="fas fa-info-circle"></i> ';
                    break;
            }

            messageEl.innerHTML = icon + message;
        }
    </script>
</body>
</html>
